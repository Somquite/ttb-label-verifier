services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - CORS_ORIGINS=http://localhost:8080
    volumes:
      - paddle_models:/root/.paddleocr
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
volumes:
  paddle_models:
